<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwik Service</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #d9231b;
    --red-dark: #b01711;
    --ink: #1c1c1e;
    --muted: #5b5b60;
    --line: #e3e3e6;
    --paper: #ffffff;
    --tint: #f5f5f6;
    --yellow: #f6c21c;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 16px/1.4 var(--body); padding: 16px; }
  main { max-width: 1000px; margin: 0 auto; }
  a { color: inherit; text-decoration: none; }

  /* Brand header */
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase;
           line-height: .92; letter-spacing: .5px; margin: 0; }
  .brand .l1 { display: block; color: var(--red); font-size: clamp(2.6rem, 8vw, 4.2rem); }
  .brand .l2 { display: block; color: var(--ink); font-size: clamp(2.1rem, 6vw, 3.3rem); }
  .strip { display: inline-block; background: var(--yellow); color: var(--ink); font-style: italic; font-weight: 500;
           font-size: .85rem; padding: 5px 18px 5px 10px; margin: 10px 0 32px;
           clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
  .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .nav a { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase;
           letter-spacing: .5px; padding: 6px 14px; border: 2px solid var(--ink); border-radius: 6px; }
  .nav a:hover { background: var(--ink); color: #fff; }

  /* Language switch */
  .topright { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .lang { display: inline-flex; }
  .lang button { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1rem; text-transform: uppercase;
                 letter-spacing: .5px; padding: 4px 12px; margin: 0; width: auto; background: var(--paper); color: var(--ink);
                 border: 2px solid var(--ink); cursor: pointer; border-radius: 0; }
  .lang button:first-child { border-radius: 6px 0 0 6px; border-right-width: 1px; }
  .lang button:last-child { border-radius: 0 6px 6px 0; border-left-width: 1px; }
  .lang button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
  .lang button:hover:not([aria-pressed="true"]) { background: var(--ink); color: #fff; }
  @media (max-width: 640px) { .topright { align-items: flex-start; } }

  /* Panels */
  .panel { border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .panel-head { background: var(--ink); color: #fff; font-family: var(--display); font-style: italic; font-weight: 800;
                font-size: 1.25rem; text-transform: uppercase; padding: 8px 14px; border-bottom: 4px solid var(--red);
                display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .status { background: var(--red); color: #fff; font-family: var(--body); font-style: normal; font-weight: 600;
            font-size: .8rem; padding: 2px 10px; border-radius: 99px; text-transform: none; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .row:nth-child(even) { background: var(--tint); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--red); font-weight: 600; }
  .row .v { text-align: right; font-weight: 500; }
  .note { padding: 10px 14px; color: var(--muted); font-size: .9rem; }

  section { margin-top: 28px; scroll-margin-top: 16px; }
  .grid { display: grid; gap: 16px; }
  .hero { grid-template-columns: 1.2fr 1fr; align-items: start; }
  .three { grid-template-columns: repeat(3, 1fr); }
  .two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 860px) { .hero, .two { grid-template-columns: 1fr; } .three { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .three { grid-template-columns: 1fr; } }

  /* Intro copy */
  .intro p { margin: 0 0 16px; font-size: 1.1rem; color: var(--muted); max-width: 60ch; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .stats b { display: block; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.8rem; color: var(--red); line-height: 1; }
  .stats span { font-size: .8rem; color: var(--muted); }

  /* Form */
  form { padding: 14px; }
  label { display: block; color: var(--red); font-weight: 600; font-size: .85rem; margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  select, input { width: 100%; font: inherit; font-weight: 500; padding: 10px; border: 2px solid var(--ink);
                  border-radius: 6px; background: var(--paper); color: var(--ink); }
  select:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 400px) { .cols { grid-template-columns: 1fr; } }
  button { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 1.15rem; text-transform: uppercase;
           letter-spacing: .5px; padding: 12px; border-radius: 6px; border: 2px solid var(--red); cursor: pointer;
           background: var(--red); color: #fff; width: 100%; margin-top: 16px; }
  button:hover { background: var(--red-dark); border-color: var(--red-dark); }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  #msg { display: none; margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--yellow); background: var(--tint); font-weight: 500; font-size: .9rem; }

  /* Click-to-call hero */
  .callhero .panel-head .status[data-mode="live"] { background: var(--yellow); color: var(--ink); }
  .callhero .panel-head .status[data-mode="error"] { background: #fff; color: var(--red); }
  .callbody { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; padding: 18px 14px; align-items: center; }
  @media (max-width: 760px) { .callbody { grid-template-columns: 1fr; } }
  .calltext h2 { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase;
                 font-size: clamp(2rem, 5vw, 2.8rem); line-height: .95; margin: 0 0 8px; }
  .calltext h2 span { color: var(--red); }
  .calltext p { margin: 0 0 14px; color: var(--muted); font-weight: 500; max-width: 46ch; }
  .callbtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .callbtns button { width: auto; margin: 0; padding: 12px 22px; }
  .callbtns button[hidden] { display: none; }
  .callbtns .alt { background: var(--paper); color: var(--ink); border-color: var(--ink); }
  .callbtns .alt:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  .callbtns .alt.end { background: var(--ink); color: #fff; }
  .callbtns .alt.end:hover { background: var(--red); border-color: var(--red); }
  .callbtns button:disabled { opacity: .5; cursor: default; }
  .callside { background: var(--tint); border: 2px solid var(--ink); border-radius: 8px; padding: 14px; text-align: center; }
  .timer { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 3rem; line-height: 1; color: var(--red); }
  .state { font-weight: 600; margin-top: 4px; }
  .log { margin-top: 10px; max-height: 120px; overflow: auto; text-align: left; font-size: .9rem; border-top: 1px solid var(--line); padding-top: 8px; }
  .log[hidden] { display: none; }
  .log p { margin: 3px 0; font-weight: 500; }
  .log b { color: var(--red); font-weight: 600; }

  /* xApp panel (shown when the flow sends an xApp URL during a call) */
  .xapp { margin-top: 20px; }
  .xapp[hidden] { display: none; }
  .xapp iframe { display: block; width: 100%; height: 420px; max-height: 85vh; border: 0; background: var(--paper); }

  /* Section titles */
  h2.title { font-family: var(--display); font-style: italic; font-weight: 900; text-transform: uppercase;
             font-size: 2rem; line-height: 1; margin: 0 0 12px; }
  h2.title span { color: var(--red); }

  /* Service cards */
  .svc .panel-head { font-size: 1.1rem; }
  .svc .row .v { color: var(--ink); font-weight: 600; }

  /* Steps */
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; counter-reset: s; }
  @media (max-width: 860px) { .steps { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .steps { grid-template-columns: 1fr; } }
  .step { border: 2px solid var(--ink); border-radius: 8px; padding: 12px 14px; }
  .step:before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 30px; height: 30px;
                 border-radius: 50%; background: var(--red); color: #fff; font-family: var(--display); font-style: italic;
                 font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
  .step b { display: block; font-weight: 600; }
  .step span { color: var(--muted); font-size: .9rem; }

  /* FAQ */
  details { border-bottom: 1px solid var(--line); padding: 10px 14px; }
  details:nth-of-type(even) { background: var(--tint); }
  details:last-of-type { border-bottom: 0; }
  summary { cursor: pointer; font-weight: 600; color: var(--red); }
  summary:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  details p { margin: 6px 0 0; font-weight: 500; }
  ul.tips { margin: 0; padding: 10px 14px 10px 32px; }
  ul.tips li { margin: 4px 0; font-weight: 500; }
  ul.tips li::marker { color: var(--red); }

  .review { padding: 12px 14px; }
  .review .stars { color: var(--yellow); letter-spacing: 2px; }
  .review p { margin: 4px 0 6px; font-weight: 500; }
  .review b { color: var(--red); font-weight: 600; font-size: .9rem; }

  .foot { margin-top: 28px; background: var(--ink); color: #fff; border-radius: 6px; padding: 10px 14px; font-size: .8rem;
          display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .foot b { font-family: var(--display); font-style: italic; font-weight: 800; text-transform: uppercase;
            color: var(--yellow); font-size: 1rem; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 class="brand"><span class="l1">Qwik Service</span></h1>
    <div class="topright">
      <div class="lang" role="group" data-i18n-aria="langLabel">
        <button type="button" data-lang="en-US" aria-pressed="true">EN</button><button type="button" data-lang="de-DE" aria-pressed="false">DE</button>
      </div>
      <nav class="nav" aria-label="Sections">
        <a href="#services" data-i18n="navServices"></a><a href="#how" data-i18n="navHow"></a><a href="#faq" data-i18n="navFaq"></a>
      </nav>
    </div>
  </div>
  <div class="strip" data-i18n="strip"></div>

  <div class="panel callhero" id="call">
    <div class="panel-head"><span data-i18n="callHead"></span><span class="status" id="call-status" data-mode="idle"></span></div>
    <div class="callbody">
      <div class="calltext">
        <h2 data-i18n-html="callTitle"></h2>
        <p data-i18n="callText"></p>
      </div>
      <div class="callside">
        <div class="timer" id="call-timer">00:00</div>
        <div class="state" id="call-state" aria-live="polite"></div>
        <div class="callbtns">
          <button type="button" id="call-btn" class="callbtn" data-i18n="callBtn"></button>
          <button type="button" id="mute-btn" class="alt" hidden data-i18n="mute"></button>
          <button type="button" id="end-btn" class="alt end" hidden data-i18n="end"></button>
        </div>
        <div class="log" id="call-log" hidden></div>
      </div>
    </div>
  </div>

  <div class="panel xapp" id="xapp-panel" hidden>
    <div class="panel-head"><span data-i18n="xappHead"></span><span class="status" data-i18n="xappLive"></span></div>
    <iframe id="xapp-frame" data-i18n-title="xappTitle" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
  </div>

  <div class="grid" style="margin-top:20px">
    <div class="intro">
      <p data-i18n="intro"></p>
      <div class="stats">
        <div><b>4.8★</b><span data-i18n="statReviews"></span></div>
        <div><b data-i18n="statOilV"></b><span data-i18n="statOil"></span></div>
        <div><b data-i18n="statWarrV"></b><span data-i18n="statWarranty"></span></div>
      </div>
    </div>
  </div>

  <section id="services">
    <h2 class="title" data-i18n-html="svcTitle"></h2>
    <div class="grid three">
      <div class="panel svc"><div class="panel-head" data-i18n="svcOil"></div><dl style="margin:0">
        <div class="row"><span class="k" data-i18n="oilStd"></span><span class="v" data-price="39"></span></div>
        <div class="row"><span class="k" data-i18n="oilSyn"></span><span class="v" data-price="69"></span></div>
        <div class="row"><span class="k" data-i18n="oilHigh"></span><span class="v" data-price="79"></span></div></dl></div>
      <div class="panel svc"><div class="panel-head" data-i18n="svcBrk"></div><dl style="margin:0">
        <div class="row"><span class="k" data-i18n="brkInsp"></span><span class="v" data-price="0"></span></div>
        <div class="row"><span class="k" data-i18n="brkStd"></span><span class="v" data-price="129"></span></div>
        <div class="row"><span class="k" data-i18n="brkPrem"></span><span class="v" data-price="219"></span></div></dl></div>
      <div class="panel svc"><div class="panel-head" data-i18n="svcTire"></div><dl style="margin:0">
        <div class="row"><span class="k" data-i18n="tireRot"></span><span class="v" data-price="25"></span></div>
        <div class="row"><span class="k" data-i18n="tireBal"></span><span class="v" data-price="60"></span></div>
        <div class="row"><span class="k" data-i18n="tireAli"></span><span class="v" data-price="99"></span></div></dl></div>
      <div class="panel svc"><div class="panel-head" data-i18n="svcBat"></div><dl style="margin:0">
        <div class="row"><span class="k" data-i18n="batTest"></span><span class="v" data-price="0"></span></div>
        <div class="row"><span class="k" data-i18n="batRepl"></span><span class="v" data-price="149" data-from></span></div></dl></div>
      <div class="panel svc"><div class="panel-head" data-i18n="svcDiag"></div><dl style="margin:0">
        <div class="row"><span class="k" data-i18n="diagScan"></span><span class="v" data-price="59"></span></div>
        <div class="row"><span class="k" data-i18n="diagAc"></span><span class="v" data-price="49"></span></div>
        <div class="row"><span class="k" data-i18n="diagTune"></span><span class="v" data-price="189"></span></div></dl></div>
      <div class="panel svc"><div class="panel-head" data-i18n="svcMaint"></div><dl style="margin:0">
        <div class="row"><span class="k" data-i18n="mFilt"></span><span class="v" data-price="29"></span></div>
        <div class="row"><span class="k" data-i18n="mWipe"></span><span class="v" data-price="24"></span></div>
        <div class="row"><span class="k" data-i18n="mLight"></span><span class="v" data-price="19"></span></div></dl></div>
    </div>
  </section>

  <section id="how">
    <h2 class="title" data-i18n-html="howTitle"></h2>
    <div class="steps">
      <div class="step"><b data-i18n="s1"></b><span data-i18n="s1d"></span></div>
      <div class="step"><b data-i18n="s2"></b><span data-i18n="s2d"></span></div>
      <div class="step"><b data-i18n="s3"></b><span data-i18n="s3d"></span></div>
      <div class="step"><b data-i18n="s4"></b><span data-i18n="s4d"></span></div>
      <div class="step"><b data-i18n="s5"></b><span data-i18n="s5d"></span></div>
    </div>
  </section>

  <section>
    <h2 class="title" data-i18n-html="revTitle"></h2>
    <div class="grid three">
      <div class="panel review"><div class="stars">★★★★★</div><p data-i18n="r1"></p><b>Maria T.</b></div>
      <div class="panel review"><div class="stars">★★★★★</div><p data-i18n="r2"></p><b>James R.</b></div>
      <div class="panel review"><div class="stars">★★★★☆</div><p data-i18n="r3"></p><b>Priya S.</b></div>
    </div>
  </section>

  <section id="faq" class="grid two">
    <div class="panel">
      <div class="panel-head" data-i18n="faqHead"></div>
      <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
      <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
      <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
      <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
      <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
    </div>
    <div>
      <div class="panel">
        <div class="panel-head" data-i18n="tipsHead"></div>
        <ul class="tips">
          <li data-i18n="t1"></li>
          <li data-i18n="t2"></li>
          <li data-i18n="t3"></li>
          <li data-i18n="t4"></li>
        </ul>
      </div>
      <div class="panel" style="margin-top:16px">
        <div class="panel-head" data-i18n="hoursHead"></div>
        <div class="row"><span class="k" data-i18n="hMF"></span><span class="v" data-i18n="hMFv"></span></div>
        <div class="row"><span class="k" data-i18n="hSat"></span><span class="v" data-i18n="hSatv"></span></div>
        <div class="row"><span class="k" data-i18n="hSun"></span><span class="v" data-i18n="hSunv"></span></div>
      </div>
    </div>
  </section>

  <div class="foot"><b data-i18n="footTitle"></b><span data-i18n="footText"></span></div>
</main>

<script type="module">
  import { createWebRTCClient, checkWebRTCSupport } from "https://cdn.jsdelivr.net/npm/@cognigy/click-to-call-sdk@0.2.2/+esm";

  // One Cognigy endpoint per site language; the call uses whichever matches the language selected when it starts.
  const ENDPOINTS = {
    "en-US": "https://endpoint-trial.cognigy.ai/dfd3dcf8990241aed8fd53dffab8f174db7876dbf74616c0bd057b24ddb67aa3",
    "de-DE": "https://endpoint-trial.cognigy.ai/e9023f3b800a15378ca30f47a4e232129786416f51d7159f283079593fc843b5",
  };
  const $ = (id) => document.getElementById(id);
  const callBtn = $("call-btn"), endBtn = $("end-btn"), muteBtn = $("mute-btn");
  const statusEl = $("call-status"), stateEl = $("call-state"), timerEl = $("call-timer");
  const log = $("call-log");
  let client = null, timer = null, started = 0, muted = false;

  const { t } = window.i18n;
  let lastState = { key: "stReady", mode: "idle", vars: null };
  function setState(key, mode, vars) {        // mode: idle | live | error; key is an i18n key
    lastState = { key, mode, vars };
    stateEl.textContent = t(key, vars);
    statusEl.textContent = t({ idle: "pillIdle", live: "pillLive", error: "pillError" }[mode]);
    statusEl.dataset.mode = mode;
  }
  addEventListener("langchange", () => {
    setState(lastState.key, lastState.mode, lastState.vars);
    muteBtn.textContent = t(muted ? "unmute" : "mute");
  });
  function setUi(inCall, connecting) {
    callBtn.hidden = inCall;
    callBtn.disabled = !!connecting;
    endBtn.hidden = !inCall && !connecting;
    muteBtn.hidden = !inCall;
  }
  function addLine(who, text) {
    log.hidden = false;
    const p = document.createElement("p");
    const b = document.createElement("b");
    b.textContent = who;
    p.append(b, " " + text);
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }
  function startTimer() {
    started = Date.now();
    timer = setInterval(() => {
      const s = Math.floor((Date.now() - started) / 1000);
      timerEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    }, 500);
  }
  function stopTimer() { clearInterval(timer); timerEl.textContent = "00:00"; }
  // xApp: only https URLs on a cognigy.ai host are framed (the URL comes from a message, so don't trust it blindly)
  const xappPanel = $("xapp-panel"), xappFrame = $("xapp-frame");
  function showXapp(url) {
    let u;
    try { u = new URL(url); } catch (_) { console.warn("[qwik-call] xApp URL invalid"); return; }
    if (u.protocol !== "https:" || !/(^|\.)cognigy\.ai$/.test(u.hostname)) {
      console.warn("[qwik-call] xApp URL blocked (host not allowed):", u.hostname); return;
    }
    xappFrame.src = u.href;
    xappPanel.hidden = false;
    xappPanel.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function hideXapp() { xappPanel.hidden = true; xappFrame.removeAttribute("src"); }

  // Messages from the xApp (its SDK posts x-app-submit to the top page after a submit; the xApp also reports its height)
  addEventListener("message", (e) => {
    const d = e.data;
    if (!d || typeof d !== "object" || xappPanel.hidden) return;
    if (d.type === "x-app-submit") {
      console.log("[qwik-call] xApp submit", d.success ? "accepted" : "rejected", d);
      if (d.success) hideXapp();
    } else if (d.type === "qwik-xapp-height" && Number(d.height) > 0) {
      xappFrame.style.height = Math.min(Math.ceil(d.height) + 24, window.innerHeight * 0.85) + "px";
    } else {
      console.log("[qwik-call] xApp postMessage", e.origin, d);
    }
  });

  function reset(label, mode) {
    hideXapp();
    stopTimer(); muted = false; muteBtn.textContent = t("mute");
    setUi(false, false); setState(label, mode || "idle");
  }

  const support = checkWebRTCSupport();
  if (!support.supported) {
    callBtn.disabled = true;
    setState("stUnsupported", "error", { m: support.missing });
  } else {
    setState("stReady", "idle");
  }

  callBtn.addEventListener("click", async () => {      // must be a user gesture for audio
    setUi(false, true); setState("stConnecting", "live"); log.innerHTML = ""; log.hidden = true;
    try {
      client = await createWebRTCClient({ endpointUrl: ENDPOINTS[window.i18n.lang] || ENDPOINTS["en-US"], userId: "qwik-web-" + Math.random().toString(36).slice(2, 8) });
      // Debug: log every SDK event (filter the console by "[qwik-call]")
      ["connecting", "connected", "disconnected", "registered", "unregistered", "ringing", "answered",
       "muted", "unmuted", "ended", "failed", "infoSent", "dtmfSent", "audioEnded", "error"]
        .forEach((ev) => client.on(ev, (...args) => console.log("[qwik-call]", ev, ...args)));
      client.on("infoReceived", (e) => {
        console.log("[qwik-call] infoReceived", e);
        console.log("[qwik-call] infoReceived body:", e && e.info && e.info.body);
        try {
          const msg = JSON.parse(e.info.body);
          console.log("[qwik-call] infoReceived body (parsed JSON):", msg);
          if (msg && String(msg.type).toLowerCase() === "xapp") showXapp(msg.url);
        } catch (_) {}
      });
      client.on("transcription", (e) => console.log("[qwik-call] transcription", e.originator, (e.messages || []).map((m) => m.text), e));
      client.on("ringing", () => setState("stRinging", "live"));
      client.on("answered", () => { setUi(true, false); setState("stConnected", "live"); startTimer(); });
      client.on("muted", () => { muted = true; muteBtn.textContent = t("unmute"); });
      client.on("unmuted", () => { muted = false; muteBtn.textContent = t("mute"); });
      client.on("transcription", (e) => (e.messages || []).forEach((m) => addLine(e.originator === "local" ? t("you") : t("qwik"), m.text)));
      client.on("ended", () => { reset("stEnded"); client.destroy(); client = null; });
      client.on("failed", () => { reset("stFailed", "error"); client && client.destroy(); client = null; });
      client.on("error", () => setState("stError", "error"));
      await client.connectAndCall();
    } catch (err) {
      reset("stStartFail", "error");
      client = null;
    }
  });
  endBtn.addEventListener("click", () => { if (client) client.endCall(); else reset("stReady"); });
  muteBtn.addEventListener("click", () => { if (client) muted ? client.unmute() : client.mute(); });
  addEventListener("beforeunload", () => { try { client && client.destroy(); } catch (e) {} });
</script>
